<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Acceso</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="login-wrapper">
    <div class="logo-section">
      <ion-icon name="person-circle-outline" color="primary"></ion-icon>
      <h1>¡Bienvenido!</h1>
    </div>

    <ion-list lines="none" class="input-list">
      <ion-item class="custom-input">
        <ion-icon name="mail-outline" slot="start"></ion-icon>
        <ion-input label="Email" labelPlacement="floating" type="email" [(ngModel)]="email"></ion-input>
      </ion-item>

      <ion-item class="custom-input">
        <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
        <ion-input label="Contraseña" labelPlacement="floating" type="password" [(ngModel)]="password"></ion-input>
      </ion-item>
    </ion-list>

    <div class="button-section">
      <ion-button expand="block" shape="round" (click)="login()">
        Iniciar Sesión
      </ion-button>

      <ion-button expand="block" fill="clear" (click)="openRegisterModal()">
        ¿No tienes cuenta? <strong>Regístrate</strong>
      </ion-button>
    </div>
  </div>
</ion-content>
