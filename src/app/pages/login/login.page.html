<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Acceso</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="login-container" style="margin-top: 20%;">
    <div style="text-align: center; margin-bottom: 30px;">
      <ion-icon name="person-circle-outline" color="primary" style="font-size: 80px;"></ion-icon>
      <h1>¡Bienvenido!</h1>
    </div>

    <ion-list lines="none">
      <ion-item class="ion-margin-bottom" style="border: 1px solid #ccc; border-radius: 10px;">
        <ion-icon name="mail-outline" slot="start"></ion-icon>
        <ion-input label="Email" labelPlacement="floating" type="email" [(ngModel)]="email"></ion-input>
      </ion-item>

      <ion-item class="ion-margin-bottom" style="border: 1px solid #ccc; border-radius: 10px;">
        <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
        <ion-input label="Contraseña" labelPlacement="floating" type="password" [(ngModel)]="password"></ion-input>
      </ion-item>
    </ion-list>

    <ion-button expand="block" shape="round" (click)="login()" class="ion-margin-top">
      Iniciar Sesión
    </ion-button>

    <ion-button expand="block" fill="clear" (click)="openRegisterModal()">
      ¿No tienes cuenta? <strong style="margin-left: 5px;">Regístrate</strong>
    </ion-button>
  </div>
</ion-content>
